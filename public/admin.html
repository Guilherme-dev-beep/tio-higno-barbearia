<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tio Higno Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin.css">
<style>.logo-image{width:52px;height:52px;border-radius:50%;object-fit:cover;display:block;margin:auto}.side-brand .logo-image{width:40px;height:40px;margin:0}</style>
<style>
  .agenda-filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  .date-filter{display:flex;align-items:center;gap:6px;padding:4px;background:#1b1a17;border:1px solid #2c2a25;border-radius:12px}
  .date-filter input{background:#151512;border:1px solid #3b352a;color:#f4f0e8;border-radius:8px;padding:8px 10px;color-scheme:dark}
  .date-action{border:0;background:transparent;color:#aaa59b;border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12px}
  .date-action:hover{background:#2a251d;color:#f1d28f}
  #agendaDateLabel{color:#f1d28f;font-size:12px;min-width:82px;text-align:center;padding:0 5px}
  @media(max-width:650px){.agenda-filters{width:100%}.date-filter{width:100%;justify-content:space-between}.date-filter input{flex:1;min-width:0}.filters{width:100%}.filters select{flex:1;min-width:0}}
</style>
</head>
<body>
<div id="loginView" class="login-view">
  <div class="login-card">
    <img class="logo-image" src="/logo.png.png" alt="Tio Higno Barbearia" /><span>PAINEL ADMINISTRATIVO</span><h1>Tio Higno<br><em>Barbearia.</em></h1><p>Gerencie agenda, clientes e operação em um só lugar.</p>
    <form id="loginForm"><label>Senha administrativa</label><input id="password" type="password" placeholder="Digite sua senha" required><button>Entrar no painel →</button></form>
    <a href="/">← Voltar para o site</a>
  </div>
</div>
<div id="adminView" class="admin hidden">
  <aside>
    <div class="side-brand"><img class="logo-image" src="/logo.png.png" alt="Tio Higno Barbearia" /><div><b>TIO HIGNO</b><small>ADMIN</small></div></div>
    <nav id="adminNav">
      <button data-page="dashboard" class="active">⌂ <span>Visão geral</span></button>
      <button data-page="agenda">▣ <span>Agenda</span></button>
      <button data-page="clientes">♙ <span>Clientes</span></button>
      <button data-page="servicos">✂ <span>Serviços</span></button>
      <button data-page="barbeiros">♜ <span>Barbeiros</span></button>
      <button data-page="config">⚙ <span>Configurações</span></button>
      <button data-page="whatsapp">◉ <span>WhatsApp</span></button>
    </nav>
    <div class="side-bottom"><a href="/" target="_blank">↗ Ver site</a><button id="logout">↪ Sair</button></div>
  </aside>
  <main>
    <header><div><small id="todayLabel"></small><h1 id="pageTitle">Visão geral</h1></div><div class="admin-user"><span>TH</span><div><b>Administrador</b><small>Tio Higno Barbearia</small></div></div></header>
    <div id="content"></div>
  </main>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><button class="close" onclick="closeModal()">×</button><div id="modalBody"></div></div></div>
<div id="toast" class="toast"></div>
<script src="/admin.js"></script>
</body></html>
